<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Cargo Simulator</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:Arial,sans-serif;
}

#game{
  width:100%;
  height:100%;
  display:block;
}

#title{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  text-align:center;
  color:white;
  font-size:24px;
  font-weight:bold;
  text-shadow:2px 2px 5px #000;
  z-index:5;
}

.controls{
  position:absolute;
  bottom:25px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:12px;
  z-index:5;
}

button{
  width:70px;
  height:70px;
  border:0;
  border-radius:50%;
  background:rgba(20,20,20,.75);
  color:white;
  font-size:28px;
}

button:active{
  background:rgba(255,170,0,.9);
}
</style>
</head>

<body>

<div id="title">Truck Cargo Simulator</div>

<canvas id="game"></canvas>

<div class="controls">
  <button id="left">◀</button>
  <button id="forward">▲</button>
  <button id="back">▼</button>
  <button id="right">▶</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

let truck={
  x:0,
  speed:0,
  angle:0
};

let keys={
  left:false,
  right:false,
  forward:false,
  back:false
};

function control(id,name){
  const b=document.getElementById(id);

  b.addEventListener("touchstart",e=>{
    e.preventDefault();
    keys[name]=true;
  });

  b.addEventListener("touchend",e=>{
    e.preventDefault();
    keys[name]=false;
  });

  b.addEventListener("mousedown",()=>{
    keys[name]=true;
  });

  b.addEventListener("mouseup",()=>{
    keys[name]=false;
  });

  b.addEventListener("mouseleave",()=>{
    keys[name]=false;
  });
}

control("left","left");
control("right","right");
control("forward","forward");
control("back","back");

function update(){

  if(keys.forward){
    truck.speed+=0.12;
  }

  if(keys.back){
    truck.speed-=0.08;
  }

  truck.speed*=0.97;

  if(keys.left){
    truck.angle-=0.035;
  }

  if(keys.right){
    truck.angle+=0.035;
  }

  truck.x+=Math.sin(truck.angle)*truck.speed;
}

function drawRoad(){

  const w=canvas.width;
  const h=canvas.height;

  // السماء
  let sky=ctx.createLinearGradient(0,0,0,h*.55);
  sky.addColorStop(0,"#55a9df");
  sky.addColorStop(1,"#d9efff");

  ctx.fillStyle=sky;
  ctx.fillRect(0,0,w,h);

  // الجبال
  ctx.fillStyle="#657b63";
  ctx.beginPath();
  ctx.moveTo(0,h*.45);
  ctx.lineTo(w*.2,h*.22);
  ctx.lineTo(w*.4,h*.45);
  ctx.lineTo(w*.62,h*.20);
  ctx.lineTo(w,h*.45);
  ctx.closePath();
  ctx.fill();

  // الأرض
  ctx.fillStyle="#587044";
  ctx.fillRect(0,h*.45,w,h*.55);

  // الطريق
  ctx.fillStyle="#34383d";
  ctx.beginPath();
  ctx.moveTo(w*.32,h);
  ctx.lineTo(w*.45,h*.45);
  ctx.lineTo(w*.55,h*.45);
  ctx.lineTo(w*.68,h);
  ctx.closePath();
  ctx.fill();

  // خطوط الطريق
  ctx.strokeStyle="#fff";
  ctx.lineWidth=5;
  ctx.setLineDash([35,25]);

  ctx.beginPath();
  ctx.moveTo(w*.5,h*.45);
  ctx.lineTo(w*.5,h);
  ctx.stroke();

  ctx.setLineDash([]);
}

function drawTruck(){

  const w=canvas.width;
  const h=canvas.height;

  const cx=w/2+truck.x;
  const cy=h*.73;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(truck.angle);

  // ظل
  ctx.fillStyle="rgba(0,0,0,.35)";
  ctx.beginPath();
  ctx.ellipse(0,55,95,25,0,0,Math.PI*2);
  ctx.fill();

  // المقطورة
  ctx.fillStyle="#d8d8d8";
  ctx.fillRect(-75,-70,150,100);

  ctx.strokeStyle="#222";
  ctx.lineWidth=4;
  ctx.strokeRect(-75,-70,150,100);

  // الكابينة
  ctx.fillStyle="#e6a500";
  ctx.fillRect(-55,25,110,65);

  // الزجاج
  ctx.fillStyle="#263b4b";
  ctx.fillRect(-40,34,80,30);

  // المصابيح
  ctx.fillStyle="#fff4a3";
  ctx.fillRect(-48,72,15,9);
  ctx.fillRect(33,72,15,9);

  // العجلات
  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(-55,90,18,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(55,90,18,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(-55,-55,18,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(55,-55,18,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function loop(){

  update();
  drawRoad();
  drawTruck();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
